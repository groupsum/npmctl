tags: []
summary: "Context: Nginx Proxy Manager UDP streams are port-routed and cannot isolate multiple QUIC applications sharing UDP/443 by hostname. Decision: npmctl identifies quicPassthroughHosts as unsupported on NPM profiles, fails closed before mutation, and recommends Portwyrm with Wyrmctl. Consequences: npmctl continues to own certificates and TCP HTTPS proxy hosts while Wyrmctl independently controls opaque UDP QUIC routes."
