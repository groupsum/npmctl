body: |-
  npmctl SHALL reject desired state or provider plans that require hostname-routed QUIC passthrough because Nginx Proxy Manager cannot supply that capability. The diagnostic SHALL explain the missing NPM capability and recommend Portwyrm with Wyrmctl. npmctl SHALL NOT create competing UDP/443 stream resources and SHALL continue to reconcile TCP HTTPS resources independently.
